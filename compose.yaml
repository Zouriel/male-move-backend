services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav-signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      AllowedHosts: ${ALLOWED_HOSTS:?Set the exact comma-separated API host names}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=false
      Authentication__Authority: ${JWT_AUTHORITY:?Set JWT_AUTHORITY to your OIDC issuer}
      Authentication__Audience: ${JWT_AUDIENCE:-male-move-api}
      MalwareScanner__Host: clamav
      MalwareScanner__Port: "3310"
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:?Set the exact front-end origin}
      PermitStorage__Path: ${PERMIT_STORAGE_PATH:-/var/lib/male-move/private-permits}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - permit-files:/var/lib/male-move/private-permits
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]

volumes:
  postgres-data:
  permit-files:
  clamav-signatures:

networks:
  internal:

